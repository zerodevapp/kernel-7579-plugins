[profile.default]
src = "src"
out = "out"
libs = ["lib", "dependencies"]
via_ir = true
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 20_000
ast = true  # halmos needs AST; default profile is what halmos's internal `forge build` uses
dynamic_test_linking = false  # halmos can't execute vm.deployCode; keep `new X()` bytecode inline

[dependencies]
eth-infinitism-account-abstraction = "0.9.0"
solady = "0.1.26"
forge-std = "1.16.2"
"@openzeppelin-contracts" = "5.7.0"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
